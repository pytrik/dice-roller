name: Deploy

# Manual only for now — nothing deploys on push. Add a `push:` trigger later if
# that changes, but note the Discord interactions endpoint points at whatever
# was deployed last, so an accidental deploy is a live change.
on:
  workflow_dispatch:
    inputs:
      register_commands:
        description: 'Also re-register slash commands (needed if src/commands.ts changed)'
        type: boolean
        default: false
      command_scope:
        description: 'Which commands to register'
        type: choice
        options: [guild, global]
        default: guild

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Runs before deploying, not after. The generated notation page is
      # committed, and a test asserts it still matches NOTATION.md — so a stale
      # page fails here rather than shipping.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Commands are uploaded separately from code, so this is opt-in per run.
      - name: Register slash commands
        if: ${{ inputs.register_commands }}
        run: npm run ${{ inputs.command_scope == 'global' && 'register:global' || 'register' }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
